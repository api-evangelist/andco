name: Andco
description: >-
  Andco is a Y Combinator (Spring 2026) startup building an AI-agent platform
  that automates the pre-litigation case workup process for personal injury law
  firms. Its agents retrieve and synthesize case documents across fax, phone,
  email, mail, web portal, and SMS channels, including police and accident
  reports, insurance coverage verification, medical records, and medical bills,
  then draft demand letters and calculate damages. Andco covers auto accident,
  premises liability, medical malpractice, workplace injury, and mass tort
  practice areas, offering same-day go-live and a free trial on the first case.
  This profile was surfaced from Andco's Y Combinator portfolio listing and
  enriched by the API Evangelist pipeline; Andco publishes no public API,
  developer portal, or machine-readable specification at this time.
